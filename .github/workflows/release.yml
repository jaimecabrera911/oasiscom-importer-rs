name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            packages: musl-tools
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Instalar dependencias del sistema
        if: matrix.packages != null
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.packages }}

      - name: Compilar
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Publicar binario
        uses: actions/upload-artifact@v4
        with:
          name: oasiscom-importer-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/oasiscom-importer*
          if-no-files-found: error
