name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            packages: musl-tools
            ext: ""
            asset: oasis-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
            asset: oasis-windows-x86_64.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ""
            asset: oasis-macos-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            ext: ""
            asset: oasis-macos-x86_64

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Instalar dependencias del sistema
        if: matrix.packages != null
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.packages }}

      - name: Compilar
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Preparar binario
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/oasis${{ matrix.ext }}" "dist/${{ matrix.asset }}"
          chmod +x "dist/${{ matrix.asset }}"

      - name: Publicar artefacto de la ejecución
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Crear Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Descargar binarios
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
